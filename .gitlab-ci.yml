variables:
  DOCKER_TLS_CERTDIR: "/certs"
  # Definición de la imagen usando el registro de GitLab
  IMAGE: ${CI_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"

before_script:
  - echo "Iniciando etapa $CI_JOB_STAGE"

stages:
  - testing
  - quality
  - build
  - scanning
  - summary
  - deploy

# 1. ETAPA DE TESTING: Pytest + Coverage
testing:
  image: python:3.10
  stage: testing
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    # Ejecuta tests y genera reportes XML para GitLab y Sonar
    - pytest --junitxml=report.xml --cov=. --cov-report=xml:coverage.xml
  artifacts:
    when: always
    paths:
      - coverage.xml
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - main
    - practica-01

# 2. ETAPA DE CALIDAD: SonarCloud
sonarqube:
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: quality
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.sources=. -Dsonar.host.url=https://sonarcloud.io
  dependencies:
    - testing
  only:
    - main
    - practica-01

# 3. ETAPA DE BUILD: Construcción y Push de Docker
docker-build:
  image:
    name: docker:28.0.2
  services:
    - docker:28.0.2-dind
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE .
    - docker push $IMAGE
  only:
    - main
    - practica-01

# 4. ETAPA DE SCANNING: Seguridad con Trivy
scanning:
  stage: scanning
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: ${CI_REGISTRY_USER}
    TRIVY_PASSWORD: ${CI_REGISTRY_PASSWORD}
  dependencies:
    - docker-build
  cache:
    key: trivy-cache
    paths:
      - .cache
  script:
    # Escaneo de vulnerabilidades críticas y altas
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $IMAGE
  artifacts:
    paths:
      - scanning-report.json
  only:
    - main
    - practica-01

# 5. ETAPA DE SUMMARY: GitLab Pages
pages:
  stage: summary
  image: alpine
  script:
    - mkdir -p public
    # Usamos comillas simples afuera para proteger los dos puntos y las etiquetas HTML
    - 'echo "<html><body><h1>Reporte de Pipeline - Grupo Tiago, Ivan y Mar</h1><p>Estado: Exitoso</p></body></html>" > public/index.html'
  dependencies:
    - testing
    - scanning
  artifacts:
    paths:
      - public
  only:
    - main
    - practica-01

# 6. ETAPA DE DEPLOY: Amazon EKS (Kubernetes)
deploy:
  stage: deploy
  image: 
    name: alpine:3.21.3
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl bash ca-certificates aws-cli
    - export KUBECTL_VERSION=v1.29.3
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    # Configuración de credenciales de AWS
    - aws configure set aws_access_key_id ${AWS_ACCESS_KEY_ID}
    - aws configure set aws_secret_access_key ${AWS_SECRET_ACCESS_KEY}
    - aws configure set aws_session_token ${AWS_SESSION_TOKEN}
    - aws configure set region ${AWS_DEFAULT_REGION}
    - aws eks update-kubeconfig --name eks-2025-1 --region ${AWS_DEFAULT_REGION}
  script:
    # Comando final para actualizar el bot en el cluster
    # IMPORTANTE: Reemplaza 'grupoXX' por el nombre de tu namespace asignado
    - kubectl set image deployment/telegram-bot telegram-bot=$IMAGE -n Bot_de_telegram
  dependencies:
    - pages
  only:
    - main