variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}

before_script:
  - echo $CI_JOB_STAGE

stages:
  - testing
  - quality
  - build
  - scanning
  - summary
  - deploy

testing:
  image: python:3.11-slim
  stage: testing
  before_script:
    # Instalamos las librerías de tu bot y las herramientas de testing
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - echo "Ejecutando pruebas unitarias..."
    # Este es el comando mágico que genera los reportes
    - pytest --junitxml=report.xml --cov=. --cov-report=xml:coverage.xml
    - echo $CI_JOB_STAGE
  artifacts:
    paths:
      - coverage.xml
      - report.xml
  only:
    - main
    - practica-01

sonarqube: # Sin espacios al inicio
  stage: quality # 2 espacios de sangría
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - | # El guion y el pipe están alineados con 'stage'
      /usr/bin/entrypoint.sh sonar-scanner \
      -Dsonar.login="${SONAR_LOGIN}" \
      -Dsonar.organization="${SONAR_ORGANIZATION}" \
      -Dsonar.host.url="${SONAR_URL}" \
      -Dsonar.projectKey="${SONAR_PROYECT_KEY}" \
      -Dsonar.python.coverage.reportPaths=coverage.xml 2>&1 | tee sonar.log
  artifacts:
    paths:
      - sonar.log # Requisito: captura la salida para revisión
    expire_in: 1 week
  only:
    - main
    - practica-01

docker-build:
  image:
      name: docker:28.0.2
  # services Dind es necesario para ejecutar Docker
  services:
    - docker:28.0.2-dind
  stage: build
  script:
   - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
   - echo "Construyendo la imagen $IMAGE"
   - docker build -t $IMAGE .
   - echo "Subiendo la imagen al registro de GitLab..."
   - docker push $IMAGE
   - echo $IMAGE
  only:
    - main
    - practica-01

scanning:
  stage: scanning
  image:
    name: ghcr.io/aquasecurity/trivy:latest
    entrypoint: [ "" ]
  variables:
    TRIVY_USERNAME: ${CI_REGISTRY_USER}
    TRIVY_PASSWORD: ${CI_REGISTRY_PASSWORD}
    TRIVY_AUTH_URL: ${CI_REGISTRY}
  script:
    - echo "Generando reporte visual de seguridad..."
    # 1. Este comando crea el reporte HTML "bonito"
    - trivy image --format template --template "@/contrib/html.tpl" --output reporte-seguridad.html ${IMAGE}
    # 2. Mantenemos este para que sigas viendo la tabla rápida en la consola
    - trivy image --severity HIGH,CRITICAL ${IMAGE}
  artifacts:
    when: always
    paths:
      - reporte-seguridad.html
    expire_in: 1 week
  only:
    - main
    - practica-01


pages:
  stage: summary
  image: alpine
  script:
    - echo $CI_JOB_STAGE
    - mkdir -p public
    - echo "<html><body><h1>Hola Mundo</h1></body></html>" > public/index.html
  dependencies:
    - testing
    - scanning
  artifacts:
    paths:
      - public
  only:
    - main
    - practica-01


